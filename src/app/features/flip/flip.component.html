<app-tool-page [content]="content">
  @if (item(); as current) {
    @if (!isMeasured()) {
      <div
        class="flex flex-col items-center justify-center rounded-2xl border border-slate-200 bg-white px-6 py-16 text-center shadow-soft dark:border-slate-800 dark:bg-slate-900"
        aria-live="polite"
      >
        <app-icon
          name="spinner"
          [size]="26"
          svgClass="animate-spin"
          class="text-brand-600 dark:text-brand-400"
        />
        <p class="mt-3 text-sm font-medium text-slate-600 dark:text-slate-400">
          Reading {{ current.fileName }}…
        </p>
      </div>
    } @else {
      <div class="grid gap-8 lg:grid-cols-[minmax(0,1fr)_340px]">
        <div class="order-2 min-w-0 lg:order-1">
          <app-single-image-result
            [item]="current"
            [result]="result()"
            [busy]="isProcessing()"
            busyLabel="Flipping on your device…"
            previewLabel="Live preview"
            resultLabel="Flipped"
            [previewTransform]="previewTransform()"
            [previewCaption]="summary()"
            emptyIcon="flip-horizontal"
            emptyText="Your flipped image will appear here."
            emptyHint="Pick a direction, then press Flip image."
            (restart)="reset()"
          />
        </div>

        <aside class="order-1 lg:order-2">
          <app-options-panel heading="Flip direction">
            <div class="grid gap-3">
              <button
                type="button"
                (click)="toggleH()"
                [attr.aria-pressed]="flipH()"
                [class]="
                  flipH()
                    ? 'flex items-center gap-3 rounded-xl border border-brand-300 bg-brand-50 p-4 text-left transition-colors dark:border-brand-500/40 dark:bg-brand-500/10'
                    : 'flex items-center gap-3 rounded-xl border border-slate-200 p-4 text-left transition-colors hover:border-brand-300 hover:bg-brand-50/40 dark:border-slate-700 dark:hover:border-brand-500/40'
                "
              >
                <span
                  [class]="
                    flipH()
                      ? 'flex size-10 shrink-0 items-center justify-center rounded-xl bg-brand-600 text-white'
                      : 'flex size-10 shrink-0 items-center justify-center rounded-xl bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300'
                  "
                >
                  <app-icon name="flip-horizontal" [size]="20" />
                </span>
                <span class="min-w-0">
                  <span class="block text-sm font-bold">Flip horizontally</span>
                  <span class="mt-0.5 block text-xs text-slate-500 dark:text-slate-400">
                    Mirror left to right
                  </span>
                </span>
              </button>

              <button
                type="button"
                (click)="toggleV()"
                [attr.aria-pressed]="flipV()"
                [class]="
                  flipV()
                    ? 'flex items-center gap-3 rounded-xl border border-brand-300 bg-brand-50 p-4 text-left transition-colors dark:border-brand-500/40 dark:bg-brand-500/10'
                    : 'flex items-center gap-3 rounded-xl border border-slate-200 p-4 text-left transition-colors hover:border-brand-300 hover:bg-brand-50/40 dark:border-slate-700 dark:hover:border-brand-500/40'
                "
              >
                <span
                  [class]="
                    flipV()
                      ? 'flex size-10 shrink-0 items-center justify-center rounded-xl bg-brand-600 text-white'
                      : 'flex size-10 shrink-0 items-center justify-center rounded-xl bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300'
                  "
                >
                  <app-icon name="flip-vertical" [size]="20" />
                </span>
                <span class="min-w-0">
                  <span class="block text-sm font-bold">Flip vertically</span>
                  <span class="mt-0.5 block text-xs text-slate-500 dark:text-slate-400">
                    Mirror top to bottom
                  </span>
                </span>
              </button>
            </div>

            <p class="text-xs text-slate-500 dark:text-slate-400">{{ summary() }}</p>

            <app-output-format-field
              [(format)]="format"
              [(quality)]="quality"
              [(background)]="background"
              [sourceType]="current.sourceType"
              idPrefix="flip"
            />

            @if (session.errorMessage(); as message) {
              <app-alert tone="error" title="Flip failed">{{ message }}</app-alert>
            }

            <div class="border-t border-slate-100 pt-5 dark:border-slate-800">
              <app-tool-action-button
                label="Flip image"
                busyLabel="Flipping…"
                icon="flip-horizontal"
                [busy]="isProcessing()"
                [disabled]="!canFlip()"
                (activated)="flip()"
              />
            </div>
          </app-options-panel>
        </aside>
      </div>
    }
  } @else {
    <app-file-uploader
      heading="Drag & drop an image to flip"
      [multiple]="false"
      [rejected]="session.rejected()"
      (filesSelected)="addFiles($event)"
    />
  }
</app-tool-page>
