<app-tool-page [content]="content">
  @if (item(); as current) {
    @if (!isMeasured()) {
      <div
        class="flex flex-col items-center justify-center rounded-2xl border border-slate-200 bg-white px-6 py-16 text-center shadow-soft dark:border-slate-800 dark:bg-slate-900"
        aria-live="polite"
      >
        <app-icon
          name="spinner"
          [size]="26"
          svgClass="animate-spin"
          class="text-brand-600 dark:text-brand-400"
        />
        <p class="mt-3 text-sm font-medium text-slate-600 dark:text-slate-400">
          Reading {{ current.fileName }}…
        </p>
      </div>
    } @else {
      <div class="grid gap-8 lg:grid-cols-[minmax(0,1fr)_340px]">
        <div class="order-2 min-w-0 lg:order-1">
          <app-single-image-result
            [item]="current"
            [result]="result()"
            [busy]="isProcessing()"
            busyLabel="Rotating on your device…"
            previewLabel="Live preview"
            resultLabel="Rotated"
            [previewTransform]="previewTransform()"
            [previewCaption]="previewCaption()"
            emptyIcon="rotate-right"
            emptyText="Your rotated image will appear here."
            (restart)="reset()"
          />
        </div>

        <aside class="order-1 lg:order-2">
          <app-options-panel heading="Rotation">
            <div>
              <p class="mb-2 text-sm font-semibold">Quarter turns</p>
              <div class="flex items-center gap-2">
                <button
                  type="button"
                  (click)="quarterTurn(-90)"
                  class="flex flex-1 items-center justify-center gap-2 rounded-xl border border-slate-200 px-3 py-2.5 text-sm font-semibold transition-colors hover:border-brand-300 hover:text-brand-700 dark:border-slate-700 dark:hover:border-brand-500 dark:hover:text-brand-300"
                  aria-label="Rotate 90 degrees counter-clockwise"
                >
                  <app-icon name="rotate-left" [size]="17" />
                  90° left
                </button>
                <button
                  type="button"
                  (click)="quarterTurn(90)"
                  class="flex flex-1 items-center justify-center gap-2 rounded-xl border border-slate-200 px-3 py-2.5 text-sm font-semibold transition-colors hover:border-brand-300 hover:text-brand-700 dark:border-slate-700 dark:hover:border-brand-500 dark:hover:text-brand-300"
                  aria-label="Rotate 90 degrees clockwise"
                >
                  <app-icon name="rotate-right" [size]="17" />
                  90° right
                </button>
              </div>
            </div>

            <div>
              <div class="flex items-baseline justify-between">
                <label for="rotate-angle" class="text-sm font-semibold">Angle</label>
                <span
                  class="rounded-lg bg-brand-50 px-2.5 py-1 font-mono text-sm font-semibold text-brand-700 tabular-nums dark:bg-brand-500/15 dark:text-brand-300"
                >
                  {{ angle() }}°
                </span>
              </div>
              <input
                id="rotate-angle"
                type="range"
                min="0"
                max="359.9"
                step="0.1"
                class="mt-3 h-2 w-full cursor-pointer appearance-none rounded-full bg-slate-200 accent-brand-600 dark:bg-slate-700"
                [value]="angle()"
                (input)="setAngle(+$any($event.target).value)"
              />

              <div class="mt-3 flex items-center gap-2">
                <button
                  type="button"
                  (click)="nudge(-0.5)"
                  class="flex-1 rounded-lg border border-slate-200 px-2 py-1.5 text-xs font-semibold transition-colors hover:border-brand-300 dark:border-slate-700"
                >
                  −0.5°
                </button>
                <button
                  type="button"
                  (click)="nudge(-0.1)"
                  class="flex-1 rounded-lg border border-slate-200 px-2 py-1.5 text-xs font-semibold transition-colors hover:border-brand-300 dark:border-slate-700"
                >
                  −0.1°
                </button>
                <button
                  type="button"
                  (click)="nudge(0.1)"
                  class="flex-1 rounded-lg border border-slate-200 px-2 py-1.5 text-xs font-semibold transition-colors hover:border-brand-300 dark:border-slate-700"
                >
                  +0.1°
                </button>
                <button
                  type="button"
                  (click)="nudge(0.5)"
                  class="flex-1 rounded-lg border border-slate-200 px-2 py-1.5 text-xs font-semibold transition-colors hover:border-brand-300 dark:border-slate-700"
                >
                  +0.5°
                </button>
              </div>

              <button
                type="button"
                (click)="resetAngle()"
                class="mt-2 text-xs font-semibold text-brand-700 hover:underline dark:text-brand-400"
              >
                Reset to 0°
              </button>
            </div>

            @if (exposesCorners()) {
              <label class="flex cursor-pointer items-start gap-2.5 text-sm font-medium">
                <input
                  type="checkbox"
                  class="mt-0.5 size-4 rounded border-slate-300 accent-brand-600 dark:border-slate-600"
                  [checked]="transparentCorners()"
                  (change)="transparentCorners.set($any($event.target).checked)"
                />
                <span>
                  Keep the exposed corners transparent
                  <span class="mt-0.5 block text-xs font-normal text-slate-500 dark:text-slate-400">
                    Only possible with PNG and WebP. JPEG always fills them.
                  </span>
                </span>
              </label>
            }

            <app-output-format-field
              [(format)]="format"
              [(quality)]="quality"
              [(background)]="background"
              [sourceType]="current.sourceType"
              [alwaysShowBackground]="exposesCorners() && !transparentCorners()"
              [backgroundLabel]="'Corner fill colour'"
              idPrefix="rotate"
            />

            @if (session.errorMessage(); as message) {
              <app-alert tone="error" title="Rotation failed">{{ message }}</app-alert>
            }

            <div class="border-t border-slate-100 pt-5 dark:border-slate-800">
              <app-tool-action-button
                [label]="angle() === 0 ? 'Export image' : 'Rotate ' + angle() + '°'"
                busyLabel="Rotating…"
                icon="rotate-right"
                [busy]="isProcessing()"
                [disabled]="!isMeasured()"
                (activated)="rotate()"
              />
            </div>
          </app-options-panel>
        </aside>
      </div>
    }
  } @else {
    <app-file-uploader
      heading="Drag & drop an image to rotate"
      [multiple]="false"
      [rejected]="session.rejected()"
      (filesSelected)="addFiles($event)"
    />
  }
</app-tool-page>
